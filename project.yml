name: LowBitCam

options:
  bundleIdPrefix: com.mo
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  LowBitCam:
    type: application
    platform: iOS
    sources:
      - path: LowBitCam
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: LowBitCam
        PRODUCT_BUNDLE_IDENTIFIER: com.mo.lowbitcam
        INFOPLIST_FILE: LowBitCam/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        ENABLE_BITCODE: NO
        CODE_SIGN_STYLE: Automatic
