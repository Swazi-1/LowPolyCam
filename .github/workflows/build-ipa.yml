name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: lowpolycam-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5

      # Everything runs in one step and every byte of output lands in ci.log,
      # so nothing gets lost between steps. Failures are surfaced afterwards as
      # annotations, which are readable without repo admin rights.
      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -euxo pipefail
          exec > >(tee ci.log) 2>&1

          echo "### xcodes available"
          ls -d /Applications/Xcode*.app || true

          echo "### select Xcode 27"
          if [ -d /Applications/Xcode_27.0.app ]; then
            SELECTED_XCODE=/Applications/Xcode_27.0.app
          elif [ -d /Applications/Xcode_27_beta_3.app ]; then
            SELECTED_XCODE=/Applications/Xcode_27_beta_3.app
          else
            SELECTED_XCODE=/Applications/Xcode.app
          fi
          echo "picked: $SELECTED_XCODE"
          sudo xcode-select -s "$SELECTED_XCODE"

          echo "### environment"
          sw_vers
          xcode-select -p
          xcodebuild -version

          echo "### install xcodegen"
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

          echo "### repo contents"
          ls -la

          echo "### generate"
          xcodegen generate

          echo "### policy regression tests"
          swiftc LowPolyCam/ZoomPolicy.swift Tests/main.swift -o /tmp/lowpolycam-policy-tests
          /tmp/lowpolycam-policy-tests

          echo "### after generate"
          ls -la
          ls -la LowPolyCam.xcodeproj || echo "NO LowPolyCam.xcodeproj DIRECTORY"
          ls -la LowPolyCam.xcodeproj/project.pbxproj || echo "NO project.pbxproj"
          ls -la LowPolyCam.xcodeproj/xcshareddata/xcschemes || echo "NO shared schemes"

          echo "### xcodebuild -list"
          xcodebuild -list -project ./LowPolyCam.xcodeproj || echo "LIST FAILED rc=$?"

          echo "### build"
          xcodebuild \
            -project ./LowPolyCam.xcodeproj \
            -scheme LowPolyCam \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Surface real compiler failures without marking a successful build's
      # ordinary log tail as an error.
      - name: Surface errors
        if: always()
        run: |
          if [ ! -f ci.log ]; then echo "::error::no ci.log was produced"; exit 0; fi

          strip() { sed "s|/Users/runner/work/[^/]*/[^/]*/||g"; }

          echo "--- filtered errors ---"
          grep -E "error:|xcodebuild: error|cannot be opened|does not contain|No such module|NO project.pbxproj|NO LowPolyCam|LIST FAILED|Reason:" ci.log \
            | strip | sort -u | head -30 \
            | while IFS= read -r l; do echo "::error::[E] ${l:0:800}"; done

          echo "--- build summary ---"
          tail -n 25 ci.log | strip

      - name: Package .ipa
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LowPolyCam.app Payload/
          zip -qry LowPolyCam-v4-beta3-unsigned.ipa Payload
          ls -lh LowPolyCam-v4-beta3-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: LowPolyCam-v4-beta3-unsigned-ipa
          path: LowPolyCam-v4-beta3-unsigned.ipa

      - name: Full log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          path: ci.log

      - name: Mark job failed if the build failed
        if: steps.build.outcome != 'success'
        run: exit 1
