name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no signing)
        run: |
          xcodebuild \
            -project LowBitCam.xcodeproj \
            -scheme LowBitCam \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LowBitCam.app Payload/
          zip -qry LowBitCam-unsigned.ipa Payload
          ls -lh LowBitCam-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LowBitCam-unsigned-ipa
          path: LowBitCam-unsigned.ipa
