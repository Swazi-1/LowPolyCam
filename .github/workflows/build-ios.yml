name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_APP=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "Xcode 26 was not found on this runner." >&2
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"

      - name: Show build environment
        run: xcodebuild -version

      - name: Build for iPhone
        run: |
          set -o pipefail
          xcodebuild \
            -project LowPolyCam.xcodeproj \
            -scheme LowPolyCam \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Verify Files integration
        run: |
          set -euo pipefail
          APP_INFO="build/DerivedData/Build/Products/Release-iphoneos/LowPolyCam.app/Info.plist"
          for KEY in UIFileSharingEnabled LSSupportsOpeningDocumentsInPlace; do
            VALUE=$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$APP_INFO")
            if [ "$VALUE" != "true" ]; then
              echo "$KEY must be true in the built app Info.plist, got: $VALUE" >&2
              exit 1
            fi
          done

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/LowPolyCam.app build/Payload/
          cd build
          zip -r LowPolyCam-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LowPolyCam-unsigned-ipa
          path: build/LowPolyCam-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
